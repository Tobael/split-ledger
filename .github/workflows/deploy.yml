name: deploy
on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed
    branches:
      - main
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update && sudo apt-get install --yes wireguard
      - run: echo "${{ secrets.WIREGUARD_CONF }}" > wireguard.conf
      - run: sudo ln -s /usr/bin/resolvectl /usr/local/bin/resolvconf
      - run: sudo wg-quick up ./wireguard.conf
      - run: sudo wg show

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.DEPLOY_SECRET_KEY }}
          name: id_rsa
          known_hosts: ${{ secrets.SSH_HOST }}
          if_key_exists: fail
      - name: Adding Known Hosts
        run: ssh-keyscan -T 20 -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Deploy with rsync
        run: rsync -avz --delete --exclude .git --exclude .env --exclude node_modules --exclude dist ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USER }}/splitledger/
      - name: Write production configuration
        env:
          DEPLOY_ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_ENV_FILE"
          printf '%s' "$DEPLOY_ENV_FILE" | ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "umask 077; cat > '/home/${{ secrets.SSH_USER }}/splitledger/.env'; chmod 600 '/home/${{ secrets.SSH_USER }}/splitledger/.env'"
      - name: Build and start services
        run: |
          set -euo pipefail
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'bash -s' <<'REMOTE'
            set -euo pipefail
            cd /home/${{ secrets.SSH_USER }}/splitledger
            test -s .env
            required_env="
            SPLITLEDGER_DOMAIN
            SPLITLEDGER_RELAY_DOMAIN
            RELAY_ADMIN_TOKEN
            MAX_OPERATION_SIZE_BYTES
            MAX_OPERATIONS_PER_GROUP
            MAX_GROUP_STORAGE_BYTES
            MAX_TOTAL_STORAGE_BYTES
            MAX_NAMESPACES
            MAX_WS_MESSAGE_SIZE_BYTES
            MAX_NAMESPACE_CREATIONS_PER_IP_PER_MINUTE
            MAX_PUBLISHES_PER_IP_PER_MINUTE
            MAX_UPLOAD_BYTES_PER_IP_PER_MINUTE
            MAX_RATE_LIMIT_SOURCES
            MAX_CONNECTIONS_PER_IP
            TRUST_PROXY
            WS_IDLE_TIMEOUT_MS
            PAGE_SIZE
            OPERATION_RETENTION_DAYS
            "
            missing_env=""
            for key in $required_env; do
              if ! grep -Eq "^${key}=.+" .env; then
                missing_env="$missing_env $key"
              fi
            done
            if [[ -n "$missing_env" ]]; then
              echo "ENV_FILE is incomplete; missing required keys:$missing_env" >&2
              exit 1
            fi
            awk 'index($0, "RELAY_ADMIN_TOKEN=") == 1 && length(substr($0, 19)) >= 32 { found=1 } END { exit !found }' .env
            docker compose --env-file .env config --quiet
            docker compose --env-file .env up -d --build --remove-orphans
            docker compose --env-file .env ps
          REMOTE
      - name: Verify public routes
        env:
          DEPLOY_ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          env_value() {
            printf '%s\n' "$DEPLOY_ENV_FILE" | awk -v key="$1" 'index($0, key "=") == 1 { print substr($0, length(key) + 2); exit }'
          }
          SPLITLEDGER_DOMAIN="$(env_value SPLITLEDGER_DOMAIN)"
          SPLITLEDGER_RELAY_DOMAIN="$(env_value SPLITLEDGER_RELAY_DOMAIN)"
          RELAY_ADMIN_TOKEN="$(env_value RELAY_ADMIN_TOKEN)"
          test -n "$SPLITLEDGER_DOMAIN"
          test -n "$SPLITLEDGER_RELAY_DOMAIN"
          test "${#RELAY_ADMIN_TOKEN}" -ge 32
          curl --fail --show-error --silent --retry 12 --retry-all-errors --retry-delay 5 \
            "https://${SPLITLEDGER_DOMAIN}/" > /dev/null
          curl --fail --show-error --silent --retry 12 --retry-all-errors --retry-delay 5 \
            "https://${SPLITLEDGER_RELAY_DOMAIN}/api/v2/health" > /dev/null
          printf 'header = "Authorization: Bearer %s"\n' "$RELAY_ADMIN_TOKEN" \
            | curl --fail --show-error --silent --retry 12 --retry-all-errors --retry-delay 5 \
              --config - "https://${SPLITLEDGER_RELAY_DOMAIN}/api/v2/admin/storage?limit=1" > /dev/null
