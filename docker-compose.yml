services:
  # ─── Relay Server ───
  relay:
    container_name: splitledger-relay
    build:
      context: .
      dockerfile: Dockerfile.relay
    volumes:
      - /docker-compose-services/splitledger-data:/app/data
    environment:
      PORT: "8443"
      HOST: "0.0.0.0"
      DB_PATH: "/app/data/relay.db"
      RELAY_ADMIN_TOKEN: "${RELAY_ADMIN_TOKEN:-}"
      MAX_OPERATION_SIZE_BYTES: "${MAX_OPERATION_SIZE_BYTES:-65536}"
      MAX_OPERATIONS_PER_GROUP: "${MAX_OPERATIONS_PER_GROUP:-1000000}"
      MAX_GROUP_STORAGE_BYTES: "${MAX_GROUP_STORAGE_BYTES:-67108864}"
      MAX_TOTAL_STORAGE_BYTES: "${MAX_TOTAL_STORAGE_BYTES:-1073741824}"
      MAX_NAMESPACES: "${MAX_NAMESPACES:-10000}"
      MAX_WS_MESSAGE_SIZE_BYTES: "${MAX_WS_MESSAGE_SIZE_BYTES:-131072}"
      MAX_NAMESPACE_CREATIONS_PER_IP_PER_MINUTE: "${MAX_NAMESPACE_CREATIONS_PER_IP_PER_MINUTE:-30}"
      MAX_PUBLISHES_PER_IP_PER_MINUTE: "${MAX_PUBLISHES_PER_IP_PER_MINUTE:-3000}"
      MAX_UPLOAD_BYTES_PER_IP_PER_MINUTE: "${MAX_UPLOAD_BYTES_PER_IP_PER_MINUTE:-16777216}"
      MAX_RATE_LIMIT_SOURCES: "${MAX_RATE_LIMIT_SOURCES:-10000}"
      ADMISSION_DIFFICULTY_BITS: "${ADMISSION_DIFFICULTY_BITS:-16}"
      MAX_CONNECTIONS_PER_IP: "${MAX_CONNECTIONS_PER_IP:-50}"
      TRUST_PROXY: "${TRUST_PROXY:-true}"
      WS_IDLE_TIMEOUT_MS: "${WS_IDLE_TIMEOUT_MS:-300000}"
      PAGE_SIZE: "${PAGE_SIZE:-500}"
      OPERATION_RETENTION_DAYS: "${OPERATION_RETENTION_DAYS:-0}"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1:8443/api/v2/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - external_network
    labels:
      - "traefik.enable=true"
      - traefik.http.routers.splitledger-relay.rule=Host(`${SPLITLEDGER_RELAY_DOMAIN}`)
      - traefik.http.routers.splitledger-relay.entrypoints=websecure
      - traefik.http.routers.splitledger-relay.priority=100
      - traefik.http.routers.splitledger-relay.tls=true
      - traefik.http.routers.splitledger-relay.tls.certresolver=externalresolver
      - traefik.http.routers.splitledger-relay.middlewares=security-headers@file
      - traefik.http.routers.splitledger-relay.service=splitledger-relay
      - traefik.http.services.splitledger-relay.loadbalancer.server.port=8443
      - traefik.docker.network=external_network

  # ─── Web Frontend ───
  web:
    container_name: splitledger-web
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_RELAY_URL: "wss://${SPLITLEDGER_RELAY_DOMAIN}/ws"
    restart: unless-stopped
    networks:
      - external_network
    labels:
      - traefik.enable=true
      - traefik.http.routers.splitledger.rule=Host(`${SPLITLEDGER_DOMAIN}`)
      - traefik.http.routers.splitledger.entrypoints=websecure
      - traefik.http.routers.splitledger.priority=100
      - traefik.http.routers.splitledger.tls=true
      - traefik.http.routers.splitledger.tls.certresolver=externalresolver
      - traefik.http.routers.splitledger.middlewares=splitledger-nocache,security-headers@file
      - traefik.http.services.splitledger.loadbalancer.server.port=80
      - traefik.docker.network=external_network

      # ─── Cache Control Middleware ───
      # Prevent browser caching of index.html so updates are visible immediately
      - "traefik.http.middlewares.splitledger-nocache.headers.customresponseheaders.Cache-Control=no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"

networks:
  external_network:
    external: true
    name: external_network
