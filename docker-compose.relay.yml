services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile.relay
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RELAY_PORT:-8443}:8443"
    environment:
      PORT: "8443"
      HOST: "0.0.0.0"
      DB_PATH: "/app/data/relay.db"
      MAX_OPERATION_SIZE_BYTES: "${MAX_OPERATION_SIZE_BYTES:-65536}"
      MAX_OPERATIONS_PER_GROUP: "${MAX_OPERATIONS_PER_GROUP:-1000000}"
      MAX_CONNECTIONS_PER_IP: "${MAX_CONNECTIONS_PER_IP:-50}"
      TRUST_PROXY: "${TRUST_PROXY:-true}"
      WS_IDLE_TIMEOUT_MS: "${WS_IDLE_TIMEOUT_MS:-300000}"
      PAGE_SIZE: "${PAGE_SIZE:-500}"
      OPERATION_RETENTION_DAYS: "${OPERATION_RETENTION_DAYS:-0}"
    volumes:
      - relay-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8443/api/v2/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  relay-data:
